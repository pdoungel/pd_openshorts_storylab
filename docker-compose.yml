services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  footage-analyzer:
    build:
      context: .
      dockerfile: footage_analyzer/Dockerfile
    container_name: openshorts-footage-analyzer
    ports:
      - "8010:8010"
    volumes:
      - ./footage_analyzer:/app/footage_analyzer
      - ./workspace:/app/workspace
      # The UI may resolve a folder to either location on macOS.
      # Mount both canonical roots so the returned host path is directly usable
      # by the analyzer; no manual HOST_MEDIA_ROOT configuration is required.
      - /Users:/Users:ro
      - /Volumes:/Volumes:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FOOTAGE_ANALYZER_WORKDIR=/app/workspace/footage_analyzer
    restart: unless-stopped

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
