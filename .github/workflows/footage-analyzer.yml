name: Footage Analyzer

on:
  push:
    paths:
      - 'footage_analyzer/**'
      - 'tests/test_footage_analyzer_*.py'
      - 'dashboard/src/components/FootageAnalyzerTab.jsx'
      - '.github/workflows/footage-analyzer.yml'
  pull_request:
    paths:
      - 'footage_analyzer/**'
      - 'tests/test_footage_analyzer_*.py'
      - 'dashboard/src/components/FootageAnalyzerTab.jsx'
      - '.github/workflows/footage-analyzer.yml'

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: footage_analyzer/requirements.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install analyzer dependencies
        run: python -m pip install -r footage_analyzer/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -v footage_analyzer/tests tests/test_footage_analyzer_imports.py tests/test_footage_analyzer_matcher.py tests/test_footage_analyzer_voiceover.py
